# Build the React (Vite) website
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy Hostinger PHP APIs through Netlify (same-origin) - fixes login CORS in app + website
[[redirects]]
  from = "/api-proxy/*"
  to = "https://premind.diplomawallah.in/:splat"
  status = 200
  force = true

# Single-page app: every other address opens the React app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
