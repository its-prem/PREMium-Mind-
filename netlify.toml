# Build the React (Vite) website
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy Hostinger PHP APIs through Netlify (same-origin) - fixes login CORS in app + website
[[redirects]]
  from = "/api-proxy/*"
  to = "https://premind.diplomawallah.in/:splat"
  status = 200
  force = true

# D2D PYQ page (a plain HTML page inside public/d2dpyq/)
[[redirects]]
  from = "/d2dpyq/d2dpyqv2"
  to = "/d2dpyq/d2dpyqv2.html"
  status = 200
  force = true

[[redirects]]
  from = "/d2dpyq"
  to = "/d2dpyq/d2dpyqv2.html"
  status = 200
  force = true

[[redirects]]
  from = "/d2dpyqv2"
  to = "/d2dpyq/d2dpyqv2.html"
  status = 200
  force = true

[[redirects]]
  from = "/d2dpyqv2.html"
  to = "/d2dpyq/d2dpyqv2.html"
  status = 200
  force = true

[[redirects]]
  from = "/D2DPYQV2.HTML"
  to = "/d2dpyq/d2dpyqv2.html"
  status = 200
  force = true

# Single-page app: every other address opens the React app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built files have a fingerprint in their name, so browsers may keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icons, logos and images rarely change: keep them for a week, refresh in the background after that.
[[headers]]
  for = "/ionicons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Security headers for every page (the Content-Security-Policy itself is in the built index.html, see vite.config.js)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), payment=(self)"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Permitted-Cross-Domain-Policies = "none"

